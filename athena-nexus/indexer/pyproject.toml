[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-nexus-blackarch-indexer"
version = "0.1.0"
description = "Deterministic BlackArch metadata indexer for CYBER-OS"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
blackarch-index = "blackarch_indexer:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
